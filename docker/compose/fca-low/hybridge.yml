services:
  ####################
  ##
  ##   RIE network
  ##
  ####################
  hybridge-rie:
    hostname: hybridge-rie
    build:
      context: "../../../csmr-rie"
      target: dev
    user: ${CURRENT_UID}
    depends_on:
      - broker
    volumes:
      - "../../../csmr-rie/src:/var/www/app/src:ro"
      - "../../volumes/app:/opt/scripts"
      - "../../volumes/log/:/var/log/app"
      - "../../volumes/.home:/home"
      - ../../volumes/ssl:/etc/ssl/docker_host:ro
    env_file:
      - "../shared/.env/base-app.env"
      - "../fca-low/.env/hybridge-rie.env"
    tty: true
    networks:
      - rie
    init: true
